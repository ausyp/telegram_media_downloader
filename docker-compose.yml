# Portainer: Stacks > Add stack > Repository (or paste this file into the Web editor),
# then fill in the environment variables below.
# Full guide: docs/portainer.md

services:
  telegram_media_downloader:
    image: ghcr.io/ausyp/telegram_media_downloader:latest
    container_name: telegram_media_downloader
    restart: unless-stopped
    # First run: log in once from Portainer's Console with `tmd-login`
    # (see docs/portainer.md).
    tty: true
    ports:
      - "${WEB_PORT:-5000}:5000"
    environment:
      # Required: from https://my.telegram.org/apps
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
      # Bot token from @BotFather. Everything you send to the bot gets downloaded.
      - BOT_TOKEN=${BOT_TOKEN}
      # Comma separated Telegram user ids/usernames allowed to use the bot
      # ("me" is the logged-in account).
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS:-me}
      # Password for the web UI on port 5000. Leave empty for no login.
      - WEB_LOGIN_SECRET=${WEB_LOGIN_SECRET}
      # How many files download at the same time.
      - MAX_DOWNLOAD_TASK=${MAX_DOWNLOAD_TASK:-5}
      # Optional: comma separated chat ids to fully download on start.
      - CHAT_IDS=${CHAT_IDS}
      # File name parts, in order: message_id, file_name, caption.
      # "file_name" keeps the original name; add message_id in front to avoid
      # same-name files being skipped.
      # Subfolders inside the download folder, in order: chat_title, media_datetime,
      # media_type. "none" saves every file directly in the download folder.
      - FILE_PATH_PREFIX=${FILE_PATH_PREFIX:-none}
      # Files sent straight to the bot go to <download folder>/<this>/<user id>/
      - BOT_DOWNLOAD_FOLDER=${BOT_DOWNLOAD_FOLDER:-bot_downloads}
      - FILE_NAME_PREFIX=${FILE_NAME_PREFIX:-file_name}
      - TZ=${TZ:-UTC}
    volumes:
      # config.yaml, sessions, logs and temp files
      - tmd_data:/data
      # Where downloaded media goes. Change to a host path, e.g. /mnt/media/telegram
      - ${DOWNLOAD_PATH:-tmd_downloads}:/downloads

volumes:
  tmd_data:
  tmd_downloads:
